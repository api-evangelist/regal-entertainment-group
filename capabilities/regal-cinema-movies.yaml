naftiko: 1.0.0-alpha2
info:
  label: Regal Cinema API — Movies
  description: 'Regal Cinema API — Movies. 2 operations. Lead operation: List Movies. Self-contained Naftiko capability covering
    one Regal Entertainment Group business surface.'
  tags:
  - Regal Entertainment Group
  - Movies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REGAL_ENTERTAINMENT_GROUP_API_KEY: REGAL_ENTERTAINMENT_GROUP_API_KEY
capability:
  consumes:
  - type: http
    namespace: regal-cinema-movies
    baseUri: https://api.regmovies.com/v1
    description: Regal Cinema API — Movies business capability. Self-contained, no shared references.
    resources:
    - name: movies
      path: /movies
      operations:
      - name: listmovies
        method: GET
        description: List Movies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by movie status (now_playing, upcoming, all)
        - name: limit
          in: query
          type: integer
          description: Maximum number of movies to return
        - name: offset
          in: query
          type: integer
          description: Pagination offset
    - name: movies-movieId
      path: /movies/{movieId}
      operations:
      - name: getmovie
        method: GET
        description: Get Movie
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.REGAL_ENTERTAINMENT_GROUP_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: regal-cinema-movies-rest
    port: 8080
    description: REST adapter for Regal Cinema API — Movies. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/movies
      name: movies
      description: REST surface for movies.
      operations:
      - method: GET
        name: listmovies
        description: List Movies
        call: regal-cinema-movies.listmovies
        with:
          status: rest.status
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/movies/{movieid}
      name: movies-movieid
      description: REST surface for movies-movieId.
      operations:
      - method: GET
        name: getmovie
        description: Get Movie
        call: regal-cinema-movies.getmovie
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: regal-cinema-movies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Regal Cinema API — Movies. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-movies
      description: List Movies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: regal-cinema-movies.listmovies
      with:
        status: tools.status
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: get-movie
      description: Get Movie
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: regal-cinema-movies.getmovie
      outputParameters:
      - type: object
        mapping: $.
