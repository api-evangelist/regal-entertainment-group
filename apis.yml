description: >-
  Regal Entertainment Group operates one of the largest motion picture theatre circuits in the United States, with
  theatres located in densely populated metropolitan markets. Regal provides a developer API portal at
  developer.regmovies.com, built on Azure API Management, enabling partners and developers to integrate movie showtimes,
  theatre listings, ticketing, and loyalty reward capabilities into applications. Regal was acquired by Cineworld Group
  in 2018 and continues to operate under the Regal brand.
